<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="履歴電卓">
  <meta name="description" content="過去の計算を再利用できる、iPhone向けのシンプルな電卓">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>履歴電卓</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">REUSE CALCULATOR</p>
        <h1>履歴電卓</h1>
      </div>
      <div class="top-actions"><button id="importButton" class="text-button" type="button">復元</button><button id="backupButton" class="text-button" type="button">バックアップ</button></div>
    </header>

    <section class="calculator panel" aria-label="電卓">
      <label class="sr-only" for="expression">計算式</label>
      <textarea id="expression" rows="2" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="計算式を入力"></textarea>
      <div class="result-line">
        <span class="result-label">結果</span>
        <output id="result" aria-live="polite">0</output>
      </div>
      <p id="status" class="status" role="status">計算式を入力してください</p>

      <div class="keypad" aria-label="入力キー">
        <button class="key key-muted" data-action="clear">AC</button>
        <button class="key key-muted" data-insert="(">(</button>
        <button class="key key-muted" data-insert=")">)</button>
        <button class="key key-op" data-insert="÷">÷</button>

        <button class="key" data-insert="7">7</button>
        <button class="key" data-insert="8">8</button>
        <button class="key" data-insert="9">9</button>
        <button class="key key-op" data-insert="×">×</button>

        <button class="key" data-insert="4">4</button>
        <button class="key" data-insert="5">5</button>
        <button class="key" data-insert="6">6</button>
        <button class="key key-op" data-insert="-">−</button>

        <button class="key" data-insert="1">1</button>
        <button class="key" data-insert="2">2</button>
        <button class="key" data-insert="3">3</button>
        <button class="key key-op" data-insert="+">+</button>

        <button class="key key-muted" data-action="backspace">⌫</button>
        <button class="key" data-insert="0">0</button>
        <button class="key" data-insert=".">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>

      <div class="edit-actions">
        <button id="pasteButton" class="secondary-button" type="button">アプリ内コピーを貼り付け</button>
        <button id="externalPasteButton" class="secondary-button" type="button">外部から貼り付け</button>
      </div>
      <p class="hint">履歴の式を長押しして範囲選択 →「選択部分をコピー」。貼り付け先の位置をタップしてから貼り付け。</p>
    </section>

    <section class="history-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR CALCULATIONS</p>
          <h2>計算履歴</h2>
        </div>
        <button id="clearHistoryButton" class="text-button danger-text" type="button">履歴を削除</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-state">まだ履歴はありません</p>
      </div>
    </section>
    <footer>履歴はこのiPhone内に保存されます。</footer>
  </main>

  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="./app.js"></script>
</body>
</html>
