<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f6f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="履歴電卓">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css">
<title>履歴電卓</title>
</head>
<body>
<main class="app">
<header><div><h1>履歴電卓</h1><p>式をつくって、履歴から再利用</p><p class="version">Ver. 1.1.0</p></div><button id="exportBtn" class="small">バックアップ</button></header>
<section class="calculator" aria-label="電卓">
  <label for="expression">計算式</label>
  <input id="expression" type="text" value="" placeholder="数字や演算子を入力" readonly inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-readonly="true">
  <div id="result" class="result" aria-live="polite">0</div>
  <div id="message" class="message" aria-live="polite">下のキーで入力</div>
  <div class="keypad" id="keypad">
    <button data-key="C" class="utility">C</button><button data-key="(" class="utility">(</button><button data-key=")" class="utility">)</button><button data-key="⌫" class="utility">⌫</button>
    <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="÷" class="operator">÷</button>
    <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="×" class="operator">×</button>
    <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="−" class="operator">−</button>
    <button data-key="貼付" class="utility">貼付</button><button data-key="0">0</button><button data-key=".">.</button><button data-key="+" class="operator">+</button>
    <button data-key="=" class="equals">=</button>
  </div>
</section>
<section class="history-section"><div class="section-head"><h2>計算履歴</h2><button id="clearHistory" class="text-button">履歴を全削除</button></div><div id="history" class="history"><p class="empty">まだ履歴はありません</p></div></section>
<footer>入力はこの画面のテンキーで行います。iPhone標準キーボードは表示しません。</footer>
</main>
<script src="app.js"></script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
